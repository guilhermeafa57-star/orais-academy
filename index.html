<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orais Academy</title>
<meta name="theme-color" content="#4F8E90">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orais Academy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  #app{border:0;width:100%;height:100%;display:block}
  #splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;transition:opacity .4s}
  #splash img{width:96px;height:96px}
  #splash p{color:#4F8E90;font-weight:600;letter-spacing:.12em;font-size:13px;margin:0}
  .dot{width:34px;height:34px;border:3px solid #DBE8E8;border-top-color:#4F8E90;border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  #instBar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#2F5556;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #instBar span{flex:1;font-size:13.5px;line-height:1.35}
  #instBar button{background:#4F8E90;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px}
  #instBar .x{background:transparent;padding:6px;opacity:.7;font-size:16px}
  #pushBar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#4F8E90;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #pushBar span{flex:1;font-size:13.5px;line-height:1.35}
  #pushBar button{background:#2F5556;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px}
  #pushBar .x{background:transparent;padding:6px;opacity:.7;font-size:16px}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><div class="dot"></div><p>ORAIS&nbsp;ACADEMY</p></div>

<!-- URL do app no Apps Script (a query string ?ref é repassada automaticamente) -->
<iframe id="app" allow="camera; clipboard-write" referrerpolicy="no-referrer"></iframe>

<div id="instBar">
  <span><b>Instale o app</b> na tela inicial para acessar com um toque.</span>
  <button id="instGo">Instalar</button>
  <button class="x" id="instX">✕</button>
</div>

<div id="pushBar">
  <span><b>Ativar notificações</b> para saber de missões novas, pontos aprovados e sorteios.</span>
  <button id="pushGo">Ativar</button>
  <button class="x" id="pushX">✕</button>
</div>

<script>
var APP_URL = 'https://script.google.com/macros/s/AKfycbwAAa2pzbQQ01NrGDacx0mQLX-EfYh94ttDhTSwozbkMdCuLhkB6crl8uHDGXGvICPxcg/exec';

// Repassa ?ref=... e demais parâmetros para o app
var f = document.getElementById('app');
f.src = APP_URL + (location.search ? (APP_URL.indexOf('?')>-1?'&':'?') + location.search.slice(1) : '');
f.addEventListener('load', function(){
  var s = document.getElementById('splash');
  s.style.opacity = '0'; setTimeout(function(){ s.style.display='none'; }, 450);
});

// Service worker (obrigatório para instalar e para push)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// Banner de instalação (Android/Chrome)
var defPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); defPrompt = e;
  if (!matchMedia('(display-mode: standalone)').matches && !localStorage.getItem('instOff'))
    document.getElementById('instBar').style.display = 'flex';
});
document.getElementById('instGo').onclick = function(){
  if (defPrompt){ defPrompt.prompt(); defPrompt = null; }
  document.getElementById('instBar').style.display = 'none';
};
document.getElementById('instX').onclick = function(){
  localStorage.setItem('instOff','1');
  document.getElementById('instBar').style.display = 'none';
};

// iPhone: mostra instrução (não existe beforeinstallprompt no iOS)
var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (isIOS && !navigator.standalone && !localStorage.getItem('instOff')){
  var b = document.getElementById('instBar');
  b.querySelector('span').innerHTML = '<b>Instale o app:</b> toque na barra de endereço aí embaixo, depois no botão Compartilhar <span style="font-size:15px">⎋</span> e em "Adicionar à Tela de Início".';
  document.getElementById('instGo').style.display = 'none';
  b.style.display = 'flex';
}


// Se o casco foi instalado no endereço antigo (github.io) e agora existe domínio próprio,
// o iOS abre o app fora do escopo e mostra a barra do Safari. Avisa para reinstalar.
var DOMINIO = 'academy.orais.com.br';
if (location.hostname !== DOMINIO && location.hostname.indexOf('github.io') > -1 && (navigator.standalone || matchMedia('(display-mode: standalone)').matches)){
  var w = document.createElement('div');
  w.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:#CA5869;color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.35;z-index:11;box-shadow:0 6px 20px rgba(0,0,0,.25)';
  w.innerHTML = '<b>Endereço novo!</b> Apague este ícone e instale de novo em <b>' + DOMINIO + '</b> para o app abrir em tela cheia.';
  document.body.appendChild(w);
}

// Diagnóstico: abra com ?diag=1 para ver como o iOS está tratando o app
if (/[?&]diag=1/.test(location.search)){
  var d = document.createElement('pre');
  d.style.cssText = 'position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));background:#1F3839;color:#fff;font-size:12px;padding:10px;border-radius:10px;z-index:12;white-space:pre-wrap';
  d.textContent = 'host: ' + location.hostname +
    '\nnavigator.standalone: ' + navigator.standalone +
    '\ndisplay-mode standalone: ' + matchMedia('(display-mode: standalone)').matches +
    '\nservice worker: ' + ('serviceWorker' in navigator) +
    '\nUA: ' + navigator.userAgent;
  document.body.appendChild(d);
}

/* ===== PUSH (Firebase Cloud Messaging) ===== */
var FIREBASE = {
  apiKey: 'AIzaSyBu80hz2O1FB7Mdp5SvnIVsXCFhMV9AiIg',
  projectId: 'orais-academy',
  messagingSenderId: '661117210012',
  appId: '1:661117210012:web:6487d0c76a177054cd8c59',
  vapidKey: 'BNctan4Hj_GIEEOJg8K5Ry5C3Fdu9Ok4bVNw1qUxuPdizZEJupvSNApQd6bpy8wMigWxiGMNoEzWu4M2q9SaCR8'
};
var pushBar = document.getElementById('pushBar');
var pushMsg = null;
var emStandalone = !!navigator.standalone || matchMedia('(display-mode: standalone)').matches;
// No iPhone o push só funciona com o app instalado na tela inicial
var pushPossivel = ('Notification' in window) && ('serviceWorker' in navigator) && (!isIOS || emStandalone);

function entregarToken(){
  navigator.serviceWorker.ready.then(function(reg){
    return pushMsg.getToken({ vapidKey: FIREBASE.vapidKey, serviceWorkerRegistration: reg });
  }).then(function(token){
    if (!token) return;
    localStorage.setItem('pushToken', token);
    f.contentWindow.postMessage({ tipo:'pushToken', token:token }, '*');
  }).catch(function(e){ console.log('push token', e); });
}
function iniciarFirebase(cb){
  if (window.firebase && firebase.apps && firebase.apps.length){ cb(); return; }
  var s1=document.createElement('script'); s1.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js';
  var s2=document.createElement('script'); s2.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js';
  s1.onload=function(){ document.body.appendChild(s2); };
  s2.onload=function(){ firebase.initializeApp(FIREBASE); pushMsg = firebase.messaging(); cb(); };
  document.body.appendChild(s1);
}
if (FIREBASE.apiKey && pushPossivel){
  if (Notification.permission === 'granted'){
    // Já autorizou: renova o token em silêncio toda vez que abre
    iniciarFirebase(entregarToken);
  } else if (Notification.permission === 'default' && !localStorage.getItem('pushOff')){
    // O iOS exige que o pedido venha de um toque do usuário
    pushBar.style.display = 'flex';
  }
}
document.getElementById('pushGo').onclick = function(){
  pushBar.style.display = 'none';
  iniciarFirebase(function(){
    Notification.requestPermission().then(function(p){ if (p === 'granted') entregarToken(); });
  });
};
document.getElementById('pushX').onclick = function(){
  localStorage.setItem('pushOff','1');
  pushBar.style.display = 'none';
};
// Quando o app (iframe) terminar o login ele pode pedir o token de novo
window.addEventListener('message', function(ev){
  if (ev.data && ev.data.tipo === 'pedirPushToken'){
    var t = localStorage.getItem('pushToken');
    if (t) f.contentWindow.postMessage({ tipo:'pushToken', token:t }, '*');
  }
});
</script>
</body>
</html>
